<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Real estate video template</title>
<style>
*{margin:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0f1c;font-family:system-ui,Segoe UI,Roboto,sans-serif;color:#f4f1ea}
.bg{position:fixed;inset:-25%;background:radial-gradient(45vw 35vw at 25% 25%,rgba(212,175,106,.35),transparent),radial-gradient(45vw 40vw at 80% 80%,rgba(70,120,200,.35),transparent);animation:dr 10s ease-in-out infinite alternate}
@keyframes dr{to{transform:translate(7%,5%) scale(1.15)}}
.s{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:6vw;opacity:0}
.tag{font-size:2.6vw;letter-spacing:.5vw;color:#d4af6a;text-transform:uppercase;margin-bottom:3vw}
h1{font-size:9vw;line-height:1.05;font-weight:800}
h1 em{font-style:normal;color:#d4af6a}
p{font-size:3.4vw;color:#b9b6ad;margin-top:2.4vw}
.s1{animation:io 4s ease both .5s}
.s2{animation:io 4s ease both 4.5s}
.s3{animation:io 4s ease both 8.5s}
.s4{animation:io 4s ease both 12.5s}
.s5{animation:in 1s ease both 16.5s}
@keyframes io{0%{opacity:0;transform:translateY(4vw)}15%,85%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-3vw)}}
@keyframes in{0%{opacity:0;transform:translateY(4vw)}100%{opacity:1;transform:none}}
svg{width:70vw;height:42vw}
.chips{display:flex;flex-direction:column;gap:2.4vw;margin-top:3vw}
.chip{font-size:5.4vw;font-weight:700;padding:2vw 5vw;border:.3vw solid #d4af6a;border-radius:10vw;background:rgba(212,175,106,.1);opacity:0;animation:pop .6s ease both}
.c1{animation-delay:9s}.c2{animation-delay:10s}.c3{animation-delay:11s}
@keyframes pop{0%{opacity:0;transform:scale(.7)}100%{opacity:1;transform:none}}
.btn{margin-top:4vw;font-size:4vw;font-weight:800;color:#0a0f1c;background:#d4af6a;padding:2.2vw 6vw;border-radius:1.6vw}
.badge{position:fixed;left:0;right:0;bottom:3vw;text-align:center;font-size:2.4vw;color:#8d8a80;letter-spacing:.2vw}
.bar{position:fixed;left:0;bottom:0;height:1vw;background:#d4af6a;width:0;animation:w 20.5s linear both .5s}
@keyframes w{to{width:100%}}
.win{animation:lit 3s ease-in-out infinite alternate}@keyframes lit{from{fill:#2b3a5c}to{fill:#f2d58a}}
</style></head><body><div class="bg"></div>
<div class="s s1"><div class="tag">Sample listing</div><h1>Your next home<br><em>starts here</em></h1></div>
<div class="s s2"><svg viewBox="0 0 700 420"><rect x="0" y="330" width="700" height="90" fill="#142038"/><rect x="110" y="170" width="480" height="165" fill="#1d2b4a" stroke="#d4af6a" stroke-width="3"/><polygon points="80,170 350,60 620,170" fill="#0e1830" stroke="#d4af6a" stroke-width="3"/><rect class="win" x="150" y="210" width="90" height="70"/><rect class="win" x="305" y="210" width="90" height="70" style="animation-delay:.6s"/><rect class="win" x="460" y="210" width="90" height="70" style="animation-delay:1.2s"/><rect x="320" y="290" width="60" height="45" fill="#d4af6a"/><ellipse cx="350" cy="380" rx="230" ry="22" fill="#2f6fb8" opacity=".55"/></svg><h1 style="font-size:7vw">Modern <em>Villa</em></h1></div>
<div class="s s3"><div class="tag">Highlights (sample)</div><div class="chips"><div class="chip c1">4 Bedrooms</div><div class="chip c2">Sea View</div><div class="chip c3">Private Pool</div></div></div>
<div class="s s4"><div class="tag">Virtual tour</div><h1>See every<br><em>corner</em></h1><p>Smooth cuts, clean text, your branding</p></div>
<div class="s s5"><div class="tag">Book a viewing</div><h1>Let's make it<br><em>yours</em></h1><div class="btn">Contact Mahdi.dev</div></div>
<div class="badge">TEMPLATE · SAMPLE CONTENT, NOT A REAL LISTING</div><div class="bar"></div>
</body></html>
